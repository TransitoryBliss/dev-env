# herdr config, linked to ~/.config/herdr/config.toml. herdr's settings UI
# writes here too, so changes made in the app show up in the repo.

# Skip the first-run welcome/setup screen.
onboarding = false

[ui]
# Keep the selection after mouse-up so herdr-annotate can read it over SSH.
copy_on_select = false

# herdr-annotate (installed by `make agents/setup`)

# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

# herdr-ohmyzsh (installed by `make agents/setup`)

# The plugin's README suggests prefix+shift+r, which is herdr's own default
# for keys.reload_config; prefix+ctrl+r is free.
[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ohmyzsh.shell.reload-all"
description = "reload Oh My Zsh in idle panes"
